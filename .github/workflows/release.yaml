name: релиз

# Ежедневный «поезд релизов» в 09:00 America/Los_Angeles. Если за день в main
# ничего не попало, поезд не делает ничего: задача release видит, что HEAD уже
# помечен тегом, и пропускает шаг.
on:
  schedule:
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"        # ручной запуск всегда продолжается
          elif [ "$(TZ=America/Los_Angeles date +%H)" = "09" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"        # 09:00 по тихоокеанскому времени
          else
            echo "run=false" >> "$GITHUB_OUTPUT"       # второй кандидат из-за перевода часов; пропуск
          fi

  test:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test,train]"
      - run: pytest -q -m "not slow"

  release:
    needs: [gate, test]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # публикует релизный тег vX.Y.Z
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - id: version
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | head -1)
          # Новые релизные теги включают дочерний коммит с одними только
          # метаданными. Его родитель — коммит в main, который был протестирован
          # и опубликован.
          source=""
          if [ -n "$last" ]; then
            source=$(git rev-parse "$last^{commit}")
            if [ "$source" != "$(git rev-parse HEAD)" ] && [ "$(git log -1 --format=%s "$last")" = "chore: выпуск ${last#v}" ]; then
              source=$(git rev-parse "$last^")
            fi
          fi
          if [ "$source" = "$(git rev-parse HEAD)" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Ручной bump версии в main или публикация, на шаге тегирования которой
          # что-то сорвалось, оставляют PyPI впереди тегов; следующая версия
          # отсчитывается от более свежего из двух.
          published=$(curl -sf https://pypi.org/pypi/cactus-needle/json | python3 -c 'import json,sys; print(json.loads(sys.stdin.read(), strict=False)["info"]["version"])' || true)
          current=$(printf '%s\n%s\n' "${last#v}" "$published" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          # Версия в pyproject.toml выше всего опубликованного — это осознанный
          # bump (новая major или minor): выпускаем ровно её, иначе наращиваем patch.
          declared=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          if [ "$(printf '%s\n%s\n' "$current" "$declared" | sort -V | tail -1)" = "$declared" ] && [ "$declared" != "$current" ]; then
            echo "next=$declared" >> "$GITHUB_OUTPUT"
          else
            echo "next=$(echo "$current" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.skip != 'true'
        run: |
          next="${{ steps.version.outputs.next }}"
          sed -i "s/^version = \".*\"/version = \"$next\"/" pyproject.toml
          sed -i "s/^__version__ = \".*\"/__version__ = \"$next\"/" needle/__init__.py
      # Колёса движка живут на Hub и загружаются отдельно. Опубликовать привязку,
      # колёса которой ещё не там, заставит каждую свежую установку падать при первом использовании.
      - if: steps.version.outputs.skip != 'true'
        run: |
          pip install huggingface_hub
          python - <<'PY'
          from needle.agent import fetch
          missing = fetch.unpublished_engine_wheels()
          if missing:
              raise SystemExit("на Hub не хватает колёс движка, публикация отменена:\n  "
                               + "\n  ".join(missing))
          print("каждый закреплённый движок опубликован")
          PY
      - if: steps.version.outputs.skip != 'true'
        run: python -m build
      - if: steps.version.outputs.skip != 'true'
        run: twine check dist/*
      - if: steps.version.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
      - if: steps.version.outputs.skip != 'true'
        run: |
          # Сохраняем ровно тот версионированный исходник, из которого собран дистрибутив.
          # Релизный коммит остаётся только на теге, без записи в main.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml needle/__init__.py
          git diff --cached --quiet || git commit -m "chore: выпуск ${{ steps.version.outputs.next }}"
          git tag "v${{ steps.version.outputs.next }}"
          git push origin "v${{ steps.version.outputs.next }}"
